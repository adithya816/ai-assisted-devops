name: AI-Assisted DevOps CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t ai-devops-app ./app

      - name: Verify Docker Image
        run: |
          docker images